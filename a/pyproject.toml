[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yueji-plot"
version = "0.1.0"
description = "阅迹 · 情节梳理与故事时间线（成员 A）"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "networkx>=3.4,<4",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["backend/yueji_plot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
