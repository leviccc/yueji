[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "yueji-qa"
version = "0.1.0"
description = "阅迹成员 C：按阅读进度约束、带原文证据的中文小说问答"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "httpx>=0.27,<1", "python-multipart>=0.0.18,<1",
  "jieba==0.42.1", "rank-bm25==0.2.2", "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

